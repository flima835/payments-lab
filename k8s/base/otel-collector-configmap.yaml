# =============================================================================
# otel-collector-config.yaml
# OpenTelemetry Collector — payments-lab
# Integrações: Zabbix (PULL :8889), Grafana Tempo (:3200), Grafana Loki (:3100),
#              Cloud Monitoring/Trace/Logging (googlecloud exporter)
# =============================================================================

receivers:
  # Recebe telemetria via OTLP gRPC (4317) e OTLP HTTP (4318) das aplicações
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Recebe as métricas de conexões e requisições do Nginx local
  nginx:
    endpoint: "http://localhost/nginx_status"
    collection_interval: 10s

connectors:
  # Converte spans em métricas RED (Rate / Errors / Duration) para o Zabbix
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
    metrics_flush_interval: 15s
    dimensions:
      - name: http.method
      - name: http.status_code
      - name: service.name

processors:
  # Protege o Collector contra estouro de memória (obrigatório em produção)
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  # Agrupa dados antes de exportar, reduzindo overhead de rede
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Enriquece a telemetria com metadados da instância GCP (project_id, zone,
  # instance_id) — útil para correlacionar no Zabbix por host e no Grafana
  resourcedetection/gcp:
    detectors: [gcp]
    timeout: 10s
    override: false

exporters:
  # ---------------------------------------------------------------------------
  # Exporter Prometheus — porta 8889 (self-telemetry) + 8890 (spanmetrics)
  # O Zabbix faz PULL desses endpoints via HTTP Agent
  # ---------------------------------------------------------------------------
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otelcol
    const_labels:
      environment: production
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true
    metric_expiration: 5m

  prometheus/spanmetrics:
    endpoint: 0.0.0.0:8890
    namespace: app
    const_labels:
      environment: production
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true
    metric_expiration: 5m

  # ---------------------------------------------------------------------------
  # Grafana Tempo — recebe traces via OTLP gRPC
  # Data source no Grafana: http://35.192.18.70:3200
  # ---------------------------------------------------------------------------
  otlp/tempo:
    endpoint: "35.192.18.70:3200"
    tls:
      insecure: true
    headers:
      # Adiciona o service.name como header para facilitar pesquisa no Tempo
      X-Scope-OrgID: "payments-lab"

  # ---------------------------------------------------------------------------
  # Grafana Loki — recebe logs via HTTP
  # Data source no Grafana: http://35.192.18.70:3100
  # ---------------------------------------------------------------------------
  loki:
    endpoint: "http://35.192.18.70:3100/loki/api/v1/push"
    tls:
      insecure: true
    default_labels_enabled:
      exporter: true
      job: true
      instance: true
      level: true
    headers:
      X-Scope-OrgID: "payments-lab"

  # ---------------------------------------------------------------------------
  # Google Cloud — exporta traces→Cloud Trace, métricas→Cloud Monitoring,
  # logs→Cloud Logging (dupla observabilidade GCP nativo + Grafana)
  # ---------------------------------------------------------------------------
  googlecloud:
    project: "${env:GCP_PROJECT_ID}"

  # Log local do Collector (debug) — reduzir em produção
  logging:
    verbosity: basic

extensions:
  # Health check do Collector — pode ser monitorado pelo Zabbix (HTTP 200)
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: localhost:1777
  zpages:
    endpoint: localhost:55679

service:
  extensions: [health_check, pprof, zpages]

  pipelines:
    # -------------------------------------------------------------------------
    # TRACES: brb-transferencias → Tempo (Grafana) + Cloud Trace (GCP)
    # O spanmetrics connector gera métricas RED a partir dos spans
    # -------------------------------------------------------------------------
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/gcp, batch]
      exporters: [otlp/tempo, googlecloud, spanmetrics, logging]

    # -------------------------------------------------------------------------
    # MÉTRICAS: OTLP + Nginx + spanmetrics (RED)
    # → Prometheus :8889 (Zabbix scrape self-telemetry)
    # → Prometheus :8890 (Zabbix scrape spanmetrics / RED)
    # → Cloud Monitoring (GCP nativo)
    # -------------------------------------------------------------------------
    metrics:
      receivers: [otlp, nginx, spanmetrics]
      processors: [memory_limiter, resourcedetection/gcp, batch]
      exporters: [prometheus, prometheus/spanmetrics, googlecloud]

    # -------------------------------------------------------------------------
    # LOGS: brb-transferencias → Loki (Grafana) + Cloud Logging (GCP)
    # Os logs já carregam trace_id injetado pelo SDK OTel — correlação automática
    # -------------------------------------------------------------------------
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/gcp, batch]
      exporters: [loki, googlecloud, logging]

  # Métricas internas do próprio Collector (otelcol_*) — porta 8888
  telemetry:
    metrics:
      address: 0.0.0.0:8888
    logs:
      level: info
