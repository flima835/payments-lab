apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
      - name: payments-container
        # Ajuste PROJECT_ID conforme infra/terraform/main.tf (var.project_id)
        image: us-central1-docker.pkg.dev/PROJECT_ID/repo-payments/app:v1
        ports:
        - containerPort: 80
        env:
        # DNS interno do Service do Collector (mesmo namespace) - traces via OTLP/HTTP
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4318"
        - name: APP_VERSION
          value: "v1"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
---
apiVersion: v1
kind: Service
metadata:
  name: payments-service
spec:
  type: LoadBalancer
  selector:
    app: payments
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
