# =============================================================================
# otel-collector-config.yaml
# OpenTelemetry Collector — configuração de produção para integração PULL com Zabbix
# Alvo: GCP (Compute Engine / GKE), exportando métricas Prometheus na porta 8889
# =============================================================================

receivers:
  # Recebe telemetria via OTLP gRPC (4317) e OTLP HTTP (4318) das aplicações
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        
  # Recebe as métricas de conexões e requisições do Nginx local
  nginx:
    endpoint: "http://localhost/nginx_status"
    collection_interval: 10s

processors:
  # Protege o Collector contra estouro de memória (obrigatório em produção)
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  # Agrupa dados antes de exportar, reduzindo overhead de rede
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Enriquece a telemetria com metadados da instância GCP (project_id, zone,
  # instance_id, etc.) — útil para correlacionar métricas no Zabbix por host
  resourcedetection/gcp:
    detectors: [gcp]
    timeout: 10s
    override: false

exporters:
  # -------------------------------------------------------------------------
  # Exporter Prometheus — é este endpoint que o Zabbix fará o PULL via HTTP Agent
  # -------------------------------------------------------------------------
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otelcol
    const_labels:
      environment: production
    # Converte atributos de resource (ex.: service.name) em labels Prometheus
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true
    metric_expiration: 5m
    # -----------------------------------------------------------------------
    # SEGURANÇA MÍNIMA (GCP):
    # O exporter Prometheus NÃO possui autenticação nativa (é um endpoint de
    # scrape passivo). A segurança real deste endpoint é feita em duas camadas:
    #   1. Regra de firewall na VPC restringindo a porta 8889 apenas ao IP do
    #      Zabbix Server (ver guia de implementação, passo 2).
    #   2. TLS opcional abaixo — recomendado se o tráfego cruzar sub-redes ou
    #      sair da mesma VPC. Se o Collector e o Zabbix estiverem na mesma VPC
    #      interna, pode ser removido para simplificar (o firewall já protege).
    # -----------------------------------------------------------------------
    # tls:
    #   cert_file: /etc/otel/certs/otel-collector.crt
    #   key_file: /etc/otel/certs/otel-collector.key

  # Exporta traces/logs/métricas nativamente para o Cloud Monitoring/Trace/Logging
  # (opcional — mantenha se quiser dupla observabilidade GCP + Zabbix)
  googlecloud:
    project: "${env:GCP_PROJECT_ID}"

  # Log local do próprio Collector (debug) — remova ou reduza verbosity em produção
  logging:
    verbosity: basic

extensions:
  # Endpoint de health check — pode ser usado como segundo item Zabbix (HTTP 200)
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: localhost:1777
  zpages:
    endpoint: localhost:55679

service:
  extensions: [health_check, pprof, zpages]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/gcp, batch]
      exporters: [googlecloud, logging]

    metrics:
      # ADICIONADO AQUI: O receiver 'nginx' agora faz parte da coleta de métricas
      receivers: [otlp, nginx]
      processors: [memory_limiter, resourcedetection/gcp, batch]
      exporters: [prometheus, googlecloud]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/gcp, batch]
      exporters: [googlecloud, logging]

  # Métricas internas do próprio Collector (otelcol_*) — é isso que o Zabbix
  # vai consumir via /metrics na porta 8889 (self-telemetry + pipeline exportado)
  telemetry:
    metrics:
      address: 0.0.0.0:8888
    logs:
      level: info
